# Existing HTTPS proxy joins only the web tier; API/database stay academy-private.
# Always supply the private .env.server and an explicit academy project name.
services:
  db:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *bounded-logs
    environment:
      ALLOWED_ORIGINS: ${ACADEMY_ORIGIN:?Set the exact HTTPS academy origin}
      SECURE_COOKIES: "true"
      RUNNER_URL: ""
      RUNNER_TOKEN: ""
      # The client address for the per-address auth limit: trusted only from web's fixed address.
      # web passes on the proxy's X-Forwarded-For unchanged (Next.js rewrites add none).
      FORWARDED_ALLOW_IPS: 10.89.30.251
    networks:
      default: {}
      api_link: {}
  web:
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *bounded-logs
    networks:
      # Not on default: web reaches the API only over api_link, so the API always sees .251.
      api_link:
        ipv4_address: 10.89.30.251
      existing_proxy:
        aliases: [engineering-academy-web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
networks:
  api_link:
    internal: true
    ipam:
      # Docker assigns from the lower half only, so no other container can take .251.
      config: [{ subnet: 10.89.30.0/24, ip_range: 10.89.30.0/25 }]
  existing_proxy:
    external: true
    name: ${ACADEMY_PROXY_NETWORK:?Set the existing HTTPS proxy network}

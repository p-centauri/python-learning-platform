# Existing HTTPS proxy joins only the web tier; API/database stay academy-private.
# Always supply the private .env.server and an explicit academy project name.
services:
  db:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *bounded-logs
    environment:
      ALLOWED_ORIGINS: ${ACADEMY_ORIGIN:?Set the exact HTTPS academy origin}
      SECURE_COOKIES: "true"
      RUNNER_URL: ""
      RUNNER_TOKEN: ""
  web:
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *bounded-logs
    networks:
      default: {}
      existing_proxy:
        aliases: [engineering-academy-web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
networks:
  existing_proxy:
    external: true
    name: ${ACADEMY_PROXY_NETWORK:?Set the existing HTTPS proxy network}

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-ingest-lab"
version = "0.1.0"
description = "A bounded learning lab for typed HTTP ingestion"
requires-python = ">=3.13"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["build==1.2.2.post1", "mypy==2.3.1", "ruff==0.12.12"]

[project.scripts]
academy-ingest = "academy_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academy_ingest = ["defaults.json", "py.typed"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

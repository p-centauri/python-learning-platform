[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-resource-scopes-lab"
version = "0.1.0"
description = "Explicit bounded resource ownership, request context and weak lookup"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "mypy==2.3.1", "build==1.2.2.post1", "ruff==0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academy_resource_scopes = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"
[project]
name = "academy-ingestion-persistence-lab"
version = "0.1.0"
description = "Bounded append-only PostgreSQL ingestion with explicit transaction ownership"
requires-python = ">=3.13"
dependencies = ["psycopg2-binary==2.9.10"]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "mypy==2.3.1", "types-psycopg2==2.9.21.20260911", "build==1.2.2.post1", "ruff==0.16.7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
academy_ingestion_persistence = ["py.typed", "schema.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["postgres: requires an explicitly configured disposable PostgreSQL database"]
[tool.mypy]
strict = true
[tool.ruff]
line-length = 110
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
